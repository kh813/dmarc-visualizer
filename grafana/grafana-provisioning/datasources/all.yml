apiVersion: 1

datasources:
  - name: PostgreSQL
    type: postgres
    uid: dmarc-postgresql
    access: proxy
    orgId: 1
    url: postgres:5432
    database: $POSTGRES_DB
    user: $POSTGRES_USER
    secureJsonData:
      password: $POSTGRES_PASSWORD
    jsonData:
      sslmode: disable
      postgresVersion: 1600
    isDefault: true
    editable: false
