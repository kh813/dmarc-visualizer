[general]
# save_aggregate: Save daily statistical aggregate reports (rua) to database
save_aggregate = True

# save_forensic: Save individual failure/forensic reports (ruf) for incident & phishing investigation
# (Note: Malicious email attachment payloads are automatically stripped for security)
save_forensic = True

# save_smtp_tls: Save SMTP TLS reports (TLS-RPT) to database (parsedmarc default: False)
save_smtp_tls = True

# output: Output directory for JSON/CSV report artifacts inside container
output = /output/

[postgresql]
host = postgres
port = 5432
database = dmarc
user = parsedmarc
password = parsedmarc_password

# Optional: Automatic polling from an IMAP mailbox
# [imap] holds connection settings only.
# [imap]
# host = imap.example.com
# port = 993
# ssl = True
# user = dmarc@example.com
# password = your-imap-password

# [mailbox] holds folder and processing options (parsedmarc 8.0+).
# In [imap] these are deprecated: watch / batch_size / reports_folder /
# archive_folder still work with a warning, but "delete" is silently ignored.
# [mailbox]
# reports_folder: Folder to watch for incoming reports (default: INBOX)
# archive_folder: Processed reports are moved under this folder (default: Archive)
# Use "/" as separator and omit the "INBOX." prefix, e.g. Archive/Aggregate
# reports_folder = INBOX
# archive_folder = Archive
# watch = True
# delete = False
# batch_size: Number of messages to fetch & process per batch (default: 10, keeps peak RAM low)
# batch_size = 10
